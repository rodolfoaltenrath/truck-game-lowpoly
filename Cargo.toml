[workspace]
members = ["crates/game_core", "crates/game_core_wasm", "crates/server"]
exclude = ["legacy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"

# O cliente web baixa o .wasm: priorizar tamanho.
[profile.release.package.game_core_wasm]
opt-level = "s"
