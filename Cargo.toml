[workspace]
members = ["crates/game_core", "crates/game_sim", "crates/client", "crates/server", "crates/xtask"]
exclude = ["legacy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# Evita otimização e símbolos gigantes da UI durante o desenvolvimento.
# O perfil release mantém a otimização normal de todas as dependências.
[profile.dev.package.fyrox-ui]
opt-level = 0
debug = 0

[profile.dev.package.fyrox-impl]
opt-level = 1
debug = 0
